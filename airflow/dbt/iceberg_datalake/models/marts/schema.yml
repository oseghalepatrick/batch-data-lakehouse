version: 2

models:

  # ============================================================
  # FACT SALES
  # ============================================================

  - name: fact_sales
    description: >
      Sales fact table containing transaction-level sales records.
      Product price is resolved according to the historical product
      version that was effective when the transaction occurred.

    columns:

      - name: transaction_id
        description: Unique identifier for the sales transaction.
        data_tests:
          - not_null
          - unique

      - name: transaction_timestamp
        description: Timestamp at which the transaction occurred.
        data_tests:
          - not_null

      - name: transaction_date
        description: Calendar date derived from transaction_timestamp.
        data_tests:
          - not_null

      - name: customer_id
        description: Customer associated with the transaction.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: product_id
        description: Product associated with the transaction.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: product_name
        description: Product name applicable to the transaction.

      - name: category
        description: Product category applicable to the transaction.

      - name: store_id
        description: Store where the transaction occurred.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id

      - name: store_name
        description: Name of the store where the transaction occurred.

      - name: store_city
        description: City where the store is located.

      - name: store_country
        description: Country where the store is located.

      - name: quantity
        description: Number of units included in the transaction.
        data_tests:
          - not_null
          - positive_value

      - name: unit_price
        description: >
          Historical product price applicable when the transaction
          occurred.
        data_tests:
          - not_null

      - name: total_amount
        description: >
          Calculated transaction value as quantity multiplied by
          the historical unit price.
        data_tests:
          - not_null
          - positive_value

      - name: payment_method
        description: Payment method used for the transaction.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - credit_card
                  - debit_card
                  - cash_transfer
                  - digital_wallet

      - name: status
        description: Status of the sales transaction.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - pending
                  - cancelled


  # ============================================================
  # PRODUCT PERFORMANCE
  # ============================================================

  - name: agg_product_performance
    description: >
      Aggregated product performance metrics based on completed
      sales transactions.

    columns:

      - name: product_id
        description: Product identifier.
        data_tests:
          - not_null

      - name: product_name
        description: Product name.
        data_tests:
          - not_null

      - name: category
        description: Product category.
        data_tests:
          - not_null

      - name: total_transactions
        description: Number of distinct transactions involving the product.
        data_tests:
          - not_null
          - non_negative

      - name: unique_customers
        description: Number of distinct customers who purchased the product.
        data_tests:
          - not_null
          - non_negative

      - name: units_sold
        description: Total number of units sold.
        data_tests:
          - not_null
          - non_negative

      - name: total_revenue
        description: Total revenue generated by the product.
        data_tests:
          - not_null
          - non_negative

      - name: average_selling_price
        description: Average unit selling price for the product.
        data_tests:
          - not_null
          - non_negative


  # ============================================================
  # DAILY SALES
  # ============================================================

  - name: agg_daily_sales
    description: >
      Daily sales performance aggregated by sales date, transaction
      status and store.

    columns:

      - name: sales_date
        description: Date on which the sales transactions occurred.
        data_tests:
          - not_null

      - name: sales_status
        description: Transaction status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - pending
                  - cancelled

      - name: store_name
        description: Name of the store.

      - name: city
        description: City where the store is located.

      - name: country
        description: Country where the store is located.

      - name: total_transactions
        description: Number of distinct transactions.
        data_tests:
          - not_null
          - non_negative

      - name: unique_customers
        description: Number of distinct customers.
        data_tests:
          - not_null
          - non_negative

      - name: total_units_sold
        description: Total quantity of products sold.
        data_tests:
          - not_null
          - non_negative

      - name: total_revenue
        description: Total sales value.
        data_tests:
          - not_null

      - name: average_order_value
        description: Average transaction value.
        data_tests:
          - not_null
          - non_negative


  # ============================================================
  # CUSTOMER LIFETIME VALUE
  # ============================================================

  - name: agg_customer_lifetime_value
    description: >
      Customer purchasing metrics aggregated at the customer SCD
      Type II version level. Each record represents the purchasing
      activity associated with a customer's attributes during a
      specific effective period.

    columns:

      - name: customer_id
        description: Customer business identifier.
        data_tests:
          - not_null

      - name: customer_name
        description: Customer name during the effective period.
        data_tests:
          - not_null

      - name: city
        description: >
          Customer city during the effective period.

      - name: country
        description: Customer country during the effective period.

      - name: segment
        description: Customer segment during the effective period.

      - name: effective_start
        description: Start of the customer SCD Type II version.
        data_tests:
          - not_null

      - name: effective_end
        description: >
          End of the customer SCD Type II version. NULL indicates
          the current version.

      - name: total_orders
        description: Number of completed orders during the customer version.
        data_tests:
          - not_null
          - positive_value

      - name: lifetime_value
        description: >
          Revenue generated by the customer during this SCD version.
        data_tests:
          - not_null
          - non_negative

      - name: average_order_value
        description: Average completed order value during the customer version.
        data_tests:
          - not_null
          - non_negative

      - name: total_items_purchased
        description: Total number of items purchased during the customer version.
        data_tests:
          - not_null
          - positive_value

      - name: first_purchase_date
        description: First completed purchase date during the customer version.
        data_tests:
          - not_null

      - name: last_purchase_date
        description: Last completed purchase date during the customer version.
        data_tests:
          - not_null