checks for ${TABLE}:
  - row_count > 0:
      name: Record count
  - schema:
      fail:
        when required column missing: 
          [product_id, product_name, category]
      warn:
        when wrong column type:
          product_id: bigint
          price: double
          effective_start: date
  - duplicate_count(product_id, effective_start, effective_end, is_current) = 0:
      name: All product are unique
  - missing_count(product_id) = 0:
      name: All product have a key
  - missing_count(product_name) = 0:
      name: All product_name not null 
  - missing_count(category) = 0:
      name: All category not null 
  # Check fails when any prices are negative
  - min(price):
      fail: when < 0
  - missing_count(effective_start) = 0:
      name: All effective_start  is not null
  - invalid_count(is_current):
      name: is_current is within allowed values
      valid values: [true, false]
      fail: when > 0
