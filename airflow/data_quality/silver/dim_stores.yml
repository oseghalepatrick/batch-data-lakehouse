checks for ${TABLE}:
  - row_count > 0:
      name: Record count
  - schema:
      fail:
        when required column missing: 
          [store_id, city]
      warn:
        when wrong column type:
          store_id: bigint
          city: string
  - duplicate_count(store_id) = 0:
      name: All stores are unique
  - missing_count(store_id) = 0:
      name: All stores are unique
  - missing_count(store_id) = 0:
      name: All stores have a key
  - missing_count(city) = 0:
      name: All city is not null
  - missing_count(country) = 0:
      name: All country is not null
  - missing_count(region) = 0:
      name: All region is not null
